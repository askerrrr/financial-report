services:
  app:
    container_name: report_app
    build:
      context: ./financial-report/
      dockerfile: Dockerfile
    expose:
      - "5000"
    restart: unless-stopped
    networks:
      - front
    environment:
      - PORT=5000
      - HOST=0.0.0.0
    volumes:
      - ./.env:/report_app/.env:ro

  nginx:
    image: nginx:stable-alpine3.24
    container_name: proxy
    networks:
      - front
    environment:
      - SITE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginxconfig.io:/etc/nginx/nginxconfig.io:ro
      - ./nginx/sites-available/site.conf:/etc/nginx/sites-enabled/site.conf:ro

      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/_letsencrypt:/var/www/_letsencrypt:ro

networks:
  front:
