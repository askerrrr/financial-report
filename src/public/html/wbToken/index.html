<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Токены доступа</title>
      <link rel="stylesheet" href="/css/theme.css" type="text/css" />
  </head>
  <body>
    <body>
      <div class="page-wrapper">
        <button class="btn-to-main" onclick="window.location.href = '/'">
          ← На главную
        </button>
        <div>
          <button id="open-upload-token-modal">Добавить токен</button>
        </div>
        <div class="token-info-panel">
          <div class="token-info-card">
            <div class="token-name-group">
              <div class="token-name">
                Токен для получения
                <ul>
                  <li>списка товаров</li>
                  <li>еженедельного фин. отчета</li>
                  <li>отчета о платном хранении</li>
                  <li>отчета о затратах на рекламу</li>
                </ul>
              </div>
            </div>

            <div class="required-token-categories">
              <div class="categories-title">Необходимые категории</div>
              <span class="category-tag">Финансы</span>
              <span class="category-tag">Аналитика</span>
              <span class="category-tag">Продвижение</span>
              <span class="category-tag">Цены и скидки</span>
            </div>
          </div>

          <div class="token-info-card">
            <div class="token-name-group">
              <div class="token-name">
                Токен для установки цен на товары
                <span class="optional-label">(опционально)</span>
              </div>
            </div>

            <div class="required-token-categories">
              <div class="categories-title">Необходимые категории</div>
              <span class="category-tag">Цены и скидки</span>
            </div>
          </div>
        </div>

        <div id="token-card-container"></div>
      </div>

      <script src="/js/wbToken/index.js" type="module"></script>
    </body>

    <script src="/js/wbToken/index.js" type="module"></script>
  </body>
</html>
