<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/wbToken.css" type="text/css" />
    <link rel="stylesheet" href="/css/tokenCard.css" type="text/css" />
    <title>Токены доступа</title>
  </head>
  <body>
    <button class="btn-to-main" onclick="window.location.href = '/'">
      На главную
    </button>

    <header class="wbtoken-header">
      <div>
        <p class="wbtoken-eyebrow">Wildberries API</p>
        <h1>Управление токенами</h1>
        <p class="wbtoken-subtitle">
          Добавьте токены для работы с товарами, отчётами и ценами.
        </p>
      </div>
      <button id="open-upload-token-modal" class="add-token-button">
        Добавить токен
      </button>
    </header>

    <section class="tokens-section" aria-labelledby="tokens-section-title">
      <div class="section-heading">
        <div>
          <p class="wbtoken-eyebrow">Сохранённые подключения</p>
          <h2 id="tokens-section-title">
            Ваши токены <span id="token-count" aria-live="polite">(0)</span>
          </h2>
        </div>
      </div>
      <div id="token-card-container"></div>
    </section>

    <script src="/js/wbToken/index.js" type="module"></script>
  </body>
</html>
