<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/goods.css" type="text/css" />
    <link rel="stylesheet" href="/css/upload.css" type="text/css" />
    <title>Товары</title>
  </head>
  <body>
    <div class="top-controls">
      <button id="download-weekly-prices-file" hidden>Скачать цены на неделю</button>
      <button id="upload-weekly-prices-and-discounts-file" type="button" hidden>Загрузить цены на неделю</button>
    </div>
    <div id="week-days" hidden>
      <label for="week-days-select">Показать цены на:</label>
      <select name="week-days" id="week-days-select">
        <option value="monday">Понедельник</option>
        <option value="tuesday">Вторник</option>
        <option value="wednesday">Среду</option>
        <option value="thursday">Четверг</option>
        <option value="friday">Пятницу</option>
        <option value="saturday">Субботу</option>
        <option value="sunday">Воскресенье</option>
      </select>
    </div>
    <button id="upload-list-goods" type="button" hidden>Загрузить список товаров</button>
    <table id="list-goods-table" hidden>
      <thead id="list-goods-thead">
        <tr>
          <th>Артикул</th>
          <th>Цена</th>
          <th>Скидка продавца</th>
          <th>Цена со скидкой</th>
          <th>Цена со скидкой, включая скидку WB Клуба</th>
          <th>||</th>
        </tr>
      </thead>
      <tbody id="list-goods-tbody"></tbody>
    </table>
    <form enctype="multipart/form-data" id="upload-form" hidden>
      <label for="input-field" class="input-file">
        <input type="file" name="file" id="input-field" multiple accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
      </label>
    </form>
    <script src="/js/goods/index.js" type="module"></script>
  </body>
</html>
