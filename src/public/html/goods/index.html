<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/goods.css" type="text/css" />
    <link rel="stylesheet" href="/css/upload.css" type="text/css" />
    <title>Товары</title>
  </head>
  <body>
    <!-- <button class="open-modal-btn" id="openModal">Открыть модальное окно</button> -->
    <div class="top-controls">
      <button id="download-weekly-prices-file">Скачать цены на неделю</button>
      <button id="load-list-goods" type="button">Загрузить список товаров</button>
    </div>
    <table id="list-goods-table" hidden="true">
      <thead id="list-goods-thead">
        <tr>
          <th>Артикул</th>
          <th>Цена</th>
          <th>Скидка продавца</th>
          <th>Цена со скидкой</th>
          <th>Цена со скидкой, включая скидку WB Клуба</th>
          <th>||</th>
        </tr>
      </thead>
      <tbody id="list-goods-tbody"></tbody>
    </table>
    <form enctype="multipart/form-data" id="upload-form" hidden="true">
      <label for="input-field" class="input-file">
        <input
          type="file"
          name="file"
          id="input-field"
          multiple
          accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        />
      </label>
    </form>
    <script src="/js/goods/index.js" type="module"></script>
  </body>
</html>
